[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linkhash"
dynamic = ["version"]
description = "Shared core utilities for Linkhash Python libraries."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Linkhash", email = "oss@linkhash.ai" }]
keywords = ["linkhash", "decimal", "money"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/linkhash-ai/linkhash-python"
Issues = "https://github.com/linkhash-ai/linkhash-python/issues"

[tool.hatch.version]
path = "src/linkhash/core/__init__.py"

# `linkhash` is an implicit namespace package shared by every Linkhash
# distribution: never add src/linkhash/__init__.py.
[tool.hatch.build.targets.wheel]
packages = ["src/linkhash"]
