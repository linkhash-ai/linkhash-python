name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv provides every CPython version, including ones (like 3.9) that the
      # current GitHub runner images no longer ship.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages and test tools
        run: uv pip install pytest ./packages/linkhash ./packages/linkhash-provo
      - name: Test
        run: python -m pytest packages tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          for p in packages/*/; do python -m build "$p" --outdir dist; done
          python -m twine check --strict dist/*
